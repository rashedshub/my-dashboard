<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Room Calendar — E&amp;C Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#1E3A5F;--steel:#2E5B88;--teal:#1B6B6B;--sage:#3A6B4A;
      --gold:#BA7517;--rust:#8B3A2A;
      --bg:#F0F2F5;--surface:#fff;--border:#DDE1E7;--soft:#EDF0F4;
      --text:#0F1923;--muted:#64748B;--radius:12px;
      --ease:cubic-bezier(.65,0,.35,1);
    }
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    /* Topbar */
    .topbar{position:sticky;top:0;z-index:80;height:54px;padding:0 24px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .tb-brand{display:flex;align-items:center;gap:10px}
    .brand-mark{width:32px;height:32px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
    .brand-name{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .tb-sep{width:1px;height:18px;background:var(--border);margin:0 10px}
    .tb-page{font-size:13px;font-weight:500;color:var(--muted)}
    .tb-right{display:flex;align-items:center;gap:10px}
    .tb-link{font-size:12px;color:var(--muted);text-decoration:none;transition:color 150ms}
    .tb-link:hover{color:var(--navy)}
    .live-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--sage);background:rgba(58,107,74,.09);padding:4px 11px;border-radius:99px;border:1px solid rgba(58,107,74,.2)}
    .live-dot{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    /* Page */
    .page{max-width:1180px;margin:0 auto;padding:24px 20px 64px}
    .page-head{margin-bottom:20px}
    .page-head h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
    .page-head p{font-size:12px;color:var(--muted);margin-top:3px}
    /* Controls */
    .controls{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .week-nav{display:flex;align-items:center;gap:4px}
    .wn-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:14px;transition:all 150ms}
    .wn-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
    .wn-label{font-size:12px;font-weight:600;padding:0 12px;min-width:160px;text-align:center}
    .this-week-btn{font-size:11px;font-weight:600;padding:6px 14px;border-radius:8px;border:1px solid rgba(30,58,95,.25);color:var(--navy);background:rgba(30,58,95,.07);cursor:pointer;transition:all 150ms}
    .this-week-btn:hover{background:var(--navy);color:#fff}
    .spacer{flex:1}
    /* Room pills */
    .room-filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .rf-pill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);transition:all 150ms;white-space:nowrap}
    .rf-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .rf-pill.active{color:#fff;border-color:transparent}
    .rf-pill.all-pill{border-color:var(--border)}
    .rf-pill.all-pill.active{background:var(--navy);border-color:var(--navy)}
    /* Calendar */
    .cal-outer{background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 16px rgba(30,58,95,.07)}
    .cal-head{display:grid;background:#F8F9FB;border-bottom:1.5px solid var(--border)}
    .ch-time{padding:10px;border-right:1px solid var(--border)}
    .ch-day{padding:10px 8px;text-align:center;border-right:1px solid var(--soft)}
    .ch-day:last-child{border-right:none}
    .ch-day.is-today{background:rgba(30,58,95,.04)}
    .ch-day-name{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .ch-day-num{font-size:16px;font-weight:700;color:var(--text);margin-top:2px}
    .ch-day.is-today .ch-day-num{color:var(--navy)}
    .today-pip{width:5px;height:5px;border-radius:50%;background:var(--navy);margin:4px auto 0}
    .cal-body{}
    .cal-row{display:grid;border-bottom:1px solid var(--soft)}
    .cal-row:last-child{border-bottom:none}
    .cal-row.is-hour{border-bottom-color:var(--border)}
    .cr-time{padding:5px 10px;font-size:10px;font-weight:600;color:var(--muted);text-align:right;border-right:1.5px solid var(--border);white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;background:#F8F9FB;min-height:32px}
    .cr-time.on-hour{color:var(--text);font-size:11px}
    .cr-slot{border-right:1px solid var(--soft);min-height:32px;position:relative}
    .cr-slot:last-child{border-right:none}
    .cr-slot.is-today-col{background:rgba(30,58,95,.012)}
    .cal-row.is-now .cr-slot{background:#FFFBEB}
    .cal-row.is-now .cr-slot.is-today-col{background:#FFF5D6}
    /* Events */
    .ev-block{position:absolute;left:2px;right:2px;top:1px;border-radius:6px;padding:3px 7px;overflow:hidden;cursor:pointer;transition:filter 150ms;z-index:2}
    .ev-block:hover{filter:brightness(.91)}
    .ev-title{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ev-room{font-size:9px;opacity:.8;margin-top:1px}
    .ev-time-label{font-size:9px;opacity:.7;margin-top:1px}
    /* Modal */
    .modal-ov{position:fixed;inset:0;background:rgba(15,25,35,.4);backdrop-filter:blur(5px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 220ms}
    .modal-ov.open{opacity:1;pointer-events:all}
    .modal{background:var(--surface);border-radius:16px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.16);transform:translateY(16px) scale(.97);transition:transform 260ms var(--ease);overflow:hidden}
    .modal-ov.open .modal{transform:none}
    .modal-bar{height:5px}
    .modal-head{padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
    .modal-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
    .modal-x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:6px}
    .modal-x:hover{background:#f0f0ee}
    .modal-body{padding:16px 20px 20px}
    .md-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
    .md-row:last-child{margin-bottom:0}
    .md-icon{font-size:15px;color:var(--muted);flex-shrink:0;margin-top:1px}
    .md-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
    .md-val{font-size:13px;font-weight:500}
    /* Legend */
    .legend{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
    .leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
    .leg-sq{width:12px;height:12px;border-radius:3px}
    /* Loading/empty */
    .state-box{text-align:center;padding:60px;color:var(--muted)}
    .state-box .si{font-size:2.2rem;margin-bottom:12px}
    /* Toast */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.18);transition:all 320ms var(--ease);z-index:999;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>

<header class="topbar">
  <div class="tb-brand">
    <div class="brand-mark"><i class="ti ti-calendar-week"></i></div>
    <span class="brand-name">E&amp;C Portal</span>
    <div class="tb-sep"></div>
    <span class="tb-page">Room Calendar</span>
  </div>
  <div class="tb-right">
    <a href="index.html" class="tb-link">← Home</a>
    <a href="room-booking.html" class="tb-link">🏢 Book a Room</a>
    <span class="live-pill"><span class="live-dot"></span>Live</span>
  </div>
</header>

<div class="page">
  <div class="page-head">
    <h1>Training &amp; Meeting Room Calendar</h1>
    <p>All room bookings at a glance — weekly view. Click any event for details.</p>
  </div>

  <div class="controls">
    <div class="week-nav">
      <button class="wn-btn" id="prevWeek"><i class="ti ti-chevron-left"></i></button>
      <span class="wn-label" id="wkLabel"></span>
      <button class="wn-btn" id="nextWeek"><i class="ti ti-chevron-right"></i></button>
    </div>
    <button class="this-week-btn" id="thisWeek">This week</button>
    <div class="spacer"></div>
    <div class="room-filters" id="roomFilters">
      <div class="rf-pill all-pill active" data-room="all">
        <span class="rf-pip" style="background:var(--navy)"></span>All Rooms
      </div>
    </div>
  </div>

  <div id="calArea"><div class="state-box"><div class="si">📅</div>Loading calendar…</div></div>
  <div class="legend" id="legend"></div>
</div>

<div class="modal-ov" id="evModal">
  <div class="modal">
    <div class="modal-bar" id="evModalBar"></div>
    <div class="modal-head">
      <div class="modal-title" id="evTitle"></div>
      <button class="modal-x" id="evClose">✕</button>
    </div>
    <div class="modal-body" id="evBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="js/room-calendar.js"></script>
</body>
</html>

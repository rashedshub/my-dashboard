<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Room Book Schedule — EMS</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --navy:#1E3A5F; --steel:#2E5B88; --bg:#F0F2F5;
      --surface:#fff; --border:#bcc5d0; --text:#0F1923; --muted:#64748B;
    }
    body { font-family:'Calibri',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }

    /* ── Topbar ── */
    .topbar {
      background:var(--navy); padding:0 24px; height:52px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .brand { display:flex; align-items:center; gap:9px; }
    .brand-name { font-size:0.85rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:#fff; }
    .book-btn {
      padding:8px 18px; background:#fff; color:var(--navy);
      border:none; border-radius:6px; font-family:inherit; font-size:0.82rem;
      font-weight:700; cursor:pointer; text-decoration:none; transition:opacity 160ms;
    }
    .book-btn:hover { opacity:0.88; }

    /* ── Page layout ── */
    .page { max-width:1180px; margin:0 auto; padding:24px 16px 60px; }

    /* ── Controls bar ── */
    .controls {
      display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;
    }
    .room-label { font-size:0.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
    .room-sel {
      padding:7px 14px; border:1.5px solid var(--border); border-radius:7px;
      font-family:inherit; font-size:0.875rem; font-weight:600; color:var(--text);
      background:var(--surface); outline:none; cursor:pointer; min-width:200px;
      transition:border-color 180ms;
    }
    .room-sel:focus { border-color:var(--navy); }
    .nav-btn {
      padding:7px 14px; border:1.5px solid var(--border); border-radius:7px;
      background:var(--surface); font-family:inherit; font-size:0.875rem; font-weight:600;
      cursor:pointer; color:var(--text); transition:all 160ms;
    }
    .nav-btn:hover { border-color:var(--navy); background:var(--navy); color:#fff; }
    .today-btn {
      padding:7px 14px; border:1.5px solid var(--navy); border-radius:7px;
      background:var(--navy); color:#fff; font-family:inherit; font-size:0.875rem;
      font-weight:600; cursor:pointer; transition:opacity 160ms;
    }
    .today-btn:hover { opacity:0.85; }

    /* ── Live badge ── */
    .live-badge {
      display:inline-flex; align-items:center; gap:5px;
      font-size:0.72rem; font-weight:700; color:#166534;
      background:#dcfce7; padding:4px 10px; border-radius:99px; margin-left:auto;
    }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#166534; animation:pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Schedule table ── */
    .schedule-wrap { overflow-x:auto; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.08); }

    .sched-table { width:100%; border-collapse:collapse; min-width:700px; background:#fff; }

    /* Title row */
    .title-row td { background:var(--navy); color:#fff; font-weight:700; font-size:1rem; text-align:center; padding:10px 12px; letter-spacing:0.02em; }
    .title-date { background:#FFD700; color:#0F1923; font-weight:800; font-size:1rem; text-align:center; padding:10px 14px; white-space:nowrap; }

    /* Week label row */
    .week-row td { background:#fff; text-align:center; font-weight:700; font-size:0.875rem; padding:6px; border:1px solid var(--border); }

    /* Header rows (date + day) */
    .header-date td, .header-day td {
      background:#D6E4F0; text-align:center; font-weight:700;
      font-size:0.82rem; padding:7px 6px; border:1px solid var(--border);
    }
    .header-day td { background:#C5D9EA; font-size:0.8rem; font-weight:600; }
    .time-col { width:80px !important; }

    /* Time rows */
    .sched-table tbody tr td {
      border:1px solid var(--border); font-size:0.78rem; vertical-align:top;
      padding:0; height:28px; min-width:120px;
    }
    .sched-table tbody tr td.time-cell {
      background:#D6E4F0; font-weight:700; font-size:0.78rem; text-align:right;
      padding:4px 8px 4px 4px; white-space:nowrap; color:#0F1923;
      min-width:80px; width:80px;
    }
    .sched-table tbody tr td.empty-cell { background:#fff; }

    /* Booked cell */
    .booked-cell {
      background:#FFD700; vertical-align:middle; text-align:center;
      padding:4px 6px; cursor:pointer; transition:background 140ms;
    }
    .booked-cell:hover { background:#f0c800; }
    .booked-purpose { font-weight:700; font-size:0.76rem; color:#0F1923; line-height:1.3; }
    .booked-by      { font-size:0.7rem; color:#333; margin-top:1px; }

    /* Current time highlight */
    .current-time-row td.empty-cell { background:#fff8e1; }

    /* ── Empty state ── */
    .empty-state { text-align:center; padding:48px; color:var(--muted); font-size:0.9rem; }

    /* ── Legend ── */
    .legend { display:flex; align-items:center; gap:18px; margin-top:12px; flex-wrap:wrap; font-size:0.78rem; color:var(--muted); }
    .leg-item { display:flex; align-items:center; gap:6px; }
    .leg-box  { width:14px; height:14px; border-radius:3px; border:1px solid #ccc; }

    /* Toast */
    .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--navy); color:#fff; padding:11px 20px; border-radius:9px; font-size:0.875rem; font-weight:500; box-shadow:0 4px 20px rgba(0,0,0,.18); transition:all 320ms; z-index:999; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* ── Booking modal ── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(15,25,35,0.5);
      backdrop-filter:blur(4px); z-index:200;
      display:flex; align-items:center; justify-content:center; padding:20px;
      opacity:0; pointer-events:none; transition:opacity 250ms;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:#fff; border-radius:14px; width:100%; max-width:460px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
      transform:translateY(20px) scale(0.97);
      transition:transform 280ms cubic-bezier(0.65,0,0.35,1);
      overflow:hidden;
    }
    .modal-overlay.open .modal { transform:translateY(0) scale(1); }
    .modal-header {
      padding:20px 24px 16px; border-bottom:1px solid #DDE1E7;
      display:flex; align-items:center; justify-content:space-between;
      background:#1E3A5F; color:#fff;
    }
    .modal-header h2 { font-size:1rem; font-weight:700; }
    .modal-close { background:none; border:none; color:rgba(255,255,255,.7); font-size:1.2rem; cursor:pointer; padding:2px 6px; border-radius:5px; transition:color 150ms; }
    .modal-close:hover { color:#fff; }
    .modal-body { padding:20px 24px; }
    .modal-footer { padding:14px 24px; border-top:1px solid #DDE1E7; display:flex; gap:10px; justify-content:flex-end; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:0.75rem; font-weight:700; color:#64748B; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:5px; }
    .field input, .field select, .field textarea {
      width:100%; padding:9px 12px; border:1.5px solid #DDE1E7; border-radius:7px;
      font-family:inherit; font-size:0.875rem; color:#0F1923; background:#fafaf9;
      outline:none; transition:border-color 180ms, box-shadow 180ms;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color:#1E3A5F; background:#fff; box-shadow:0 0 0 3px rgba(30,58,95,.1);
    }
    .field textarea { resize:vertical; min-height:60px; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .conflict-banner { background:#fee2e2; border-radius:7px; padding:9px 13px; font-size:0.82rem; color:#991b1b; font-weight:600; margin-bottom:12px; display:none; }
    .conflict-banner.show { display:block; }
    .login-banner { background:#EEF3FA; border-radius:7px; padding:12px 14px; font-size:0.85rem; color:#1E3A5F; font-weight:500; margin-bottom:14px; text-align:center; }
    .login-banner a { color:#1E3A5F; font-weight:700; }
    .btn-primary { padding:10px 22px; border-radius:8px; background:#1E3A5F; color:#fff; border:none; font-family:inherit; font-size:0.875rem; font-weight:600; cursor:pointer; transition:background 180ms; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary:hover { background:#2E5B88; }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-ghost { padding:10px 16px; border-radius:8px; background:none; border:1.5px solid #DDE1E7; font-family:inherit; font-size:0.875rem; font-weight:500; cursor:pointer; color:#64748B; transition:all 180ms; }
    .btn-ghost:hover { border-color:#0F1923; color:#0F1923; }
    .spin { width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
    .btn-primary.loading .spin { display:block; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* Clickable empty cells — multi-select */
    .empty-cell {
      cursor:pointer; transition:background 120ms; position:relative; user-select:none;
    }
    .empty-cell:hover { background:#EEF3FA !important; }
    .empty-cell .slot-hint {
      display:none; font-size:0.65rem; font-weight:700; color:#1E3A5F;
      text-align:center; padding:2px 0; width:100%;
    }
    .empty-cell:hover .slot-hint { display:block; }
    /* Selected slot highlight */
    .empty-cell.selected {
      background:#BFDBFE !important;
      border-top:2px solid #1E3A5F;
      border-bottom:2px solid #1E3A5F;
    }
    .empty-cell.sel-start { border-top:2px solid #1E3A5F; border-radius:4px 4px 0 0; }
    .empty-cell.sel-end   { border-bottom:2px solid #1E3A5F; border-radius:0 0 4px 4px; }
    .empty-cell.selecting { background:#DBEAFE !important; }
    /* Selection bar at top of column when selecting */
    .sel-label {
      position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
      background:#1E3A5F; color:#fff; padding:9px 20px; border-radius:99px;
      font-size:0.82rem; font-weight:700; box-shadow:0 4px 16px rgba(30,58,95,.3);
      z-index:120; display:none; white-space:nowrap; animation:popIn 200ms both;
    }
    .sel-label.show { display:block; }
    .sel-label span { opacity:.75; font-weight:400; margin-left:8px; }

    /* Slot confirm popup */
    .slot-popup {
      position:fixed; z-index:150; background:#fff;
      border:1.5px solid #1E3A5F; border-radius:10px;
      box-shadow:0 8px 28px rgba(30,58,95,.18);
      padding:16px 18px; min-width:220px;
      animation:popIn 180ms cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes popIn { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
    .slot-popup-head { font-size:0.8rem; font-weight:700; color:#1E3A5F; margin-bottom:4px; }
    .slot-popup-sub  { font-size:0.72rem; color:#64748B; margin-bottom:12px; }
    .slot-popup-btn  {
      width:100%; padding:9px; border-radius:7px; border:none;
      background:#1E3A5F; color:#fff; font-family:inherit; font-size:0.82rem;
      font-weight:700; cursor:pointer; transition:background 160ms;
    }
    .slot-popup-btn:hover { background:#2E5B88; }
    .slot-popup-cancel { display:block; text-align:center; margin-top:8px; font-size:0.75rem; color:#64748B; cursor:pointer; }
    .slot-popup-cancel:hover { color:#0F1923; }

  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 18 18" fill="none">
        <rect x="2" y="2" width="6" height="6" rx="1.5" fill="white"/>
        <rect x="10" y="2" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
        <rect x="2" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
        <rect x="10" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".3"/>
      </svg>
      <span class="brand-name">EMS — Room Schedule</span>
    </div>
    <a href="login.html?redirect=room-booking.html" class="book-btn">📅 Book a Room</a>
  </header>

  <div class="page">

    <!-- Controls -->
    <div class="controls">
      <span class="room-label">Room:</span>
      <select class="room-sel" id="roomSel" onchange="renderSchedule()">
        <option value="">Loading rooms…</option>
      </select>
      <button class="nav-btn" id="prevWeek">‹ Prev</button>
      <button class="today-btn" id="thisWeek">This Week</button>
      <button class="nav-btn" id="nextWeek">Next ›</button>
      <span class="live-badge"><span class="live-dot"></span>Live</span>
    </div>

    <!-- Schedule table -->
    <div class="schedule-wrap" id="scheduleWrap">
      <div class="empty-state">Loading schedule…</div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="leg-item"><div class="leg-box" style="background:#FFD700;"></div>Booked</div>
      <div class="leg-item"><div class="leg-box" style="background:#fff;"></div>Available</div>
      <div class="leg-item"><div class="leg-box" style="background:#fff8e1;"></div>Current time slot</div>
    </div>

  </div>

  <div class="sel-label" id="selLabel"></div>
  <div class="toast" id="toast"></div>

  <!-- Booking Modal -->
  <div class="modal-overlay" id="bookModal">
    <div class="modal">
      <div class="modal-header">
        <h2>📅 Book Room</h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="conflict-banner" id="conflictBanner">⚠️ This slot is already booked.</div>
        <div id="bookForm">
          <div class="field">
            <label>Room</label>
            <select id="modalRoom"></select>
          </div>
          <div class="field">
            <label>Your Name</label>
            <input type="text" id="modalName" placeholder="e.g. Ahmad Rizal"/>
          </div>
          <div class="field">
            <label>Purpose / Title</label>
            <input type="text" id="modalTitle2" placeholder="e.g. Team Meeting"/>
          </div>
          <div class="field">
            <label>Date</label>
            <input type="date" id="modalDate"/>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Start Time</label>
              <input type="time" id="modalStart"/>
            </div>
            <div class="field">
              <label>End Time</label>
              <input type="time" id="modalEnd"/>
            </div>
          </div>
          <div class="field">
            <label>Notes (optional)</label>
            <textarea id="modalNotes" placeholder="Additional info…"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer" id="modalFooter">
        <button class="btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalSubmit">
          <span>Confirm Booking</span>
          <span class="spin"></span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/room-schedule.js"></script>
</body>
</html>

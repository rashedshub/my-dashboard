<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Room Book Schedule — EMS</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --navy:#1E3A5F; --steel:#2E5B88; --bg:#F0F2F5;
      --surface:#fff; --border:#bcc5d0; --text:#0F1923; --muted:#64748B;
    }
    body { font-family:'Calibri',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }

    /* ── Topbar ── */
    .topbar {
      background:var(--navy); padding:0 24px; height:52px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .brand { display:flex; align-items:center; gap:9px; }
    .brand-name { font-size:0.85rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:#fff; }
    .book-btn {
      padding:8px 18px; background:#fff; color:var(--navy);
      border:none; border-radius:6px; font-family:inherit; font-size:0.82rem;
      font-weight:700; cursor:pointer; text-decoration:none; transition:opacity 160ms;
    }
    .book-btn:hover { opacity:0.88; }

    /* ── Page layout ── */
    .page { max-width:1180px; margin:0 auto; padding:24px 16px 60px; }

    /* ── Controls bar ── */
    .controls {
      display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;
    }
    .room-label { font-size:0.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
    .room-sel {
      padding:7px 14px; border:1.5px solid var(--border); border-radius:7px;
      font-family:inherit; font-size:0.875rem; font-weight:600; color:var(--text);
      background:var(--surface); outline:none; cursor:pointer; min-width:200px;
      transition:border-color 180ms;
    }
    .room-sel:focus { border-color:var(--navy); }
    .nav-btn {
      padding:7px 14px; border:1.5px solid var(--border); border-radius:7px;
      background:var(--surface); font-family:inherit; font-size:0.875rem; font-weight:600;
      cursor:pointer; color:var(--text); transition:all 160ms;
    }
    .nav-btn:hover { border-color:var(--navy); background:var(--navy); color:#fff; }
    .today-btn {
      padding:7px 14px; border:1.5px solid var(--navy); border-radius:7px;
      background:var(--navy); color:#fff; font-family:inherit; font-size:0.875rem;
      font-weight:600; cursor:pointer; transition:opacity 160ms;
    }
    .today-btn:hover { opacity:0.85; }

    /* ── Live badge ── */
    .live-badge {
      display:inline-flex; align-items:center; gap:5px;
      font-size:0.72rem; font-weight:700; color:#166534;
      background:#dcfce7; padding:4px 10px; border-radius:99px; margin-left:auto;
    }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#166534; animation:pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Schedule table ── */
    .schedule-wrap { overflow-x:auto; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.08); }

    .sched-table { width:100%; border-collapse:collapse; min-width:700px; background:#fff; }

    /* Title row */
    .title-row td { background:var(--navy); color:#fff; font-weight:700; font-size:1rem; text-align:center; padding:10px 12px; letter-spacing:0.02em; }
    .title-date { background:#FFD700; color:#0F1923; font-weight:800; font-size:1rem; text-align:center; padding:10px 14px; white-space:nowrap; }

    /* Week label row */
    .week-row td { background:#fff; text-align:center; font-weight:700; font-size:0.875rem; padding:6px; border:1px solid var(--border); }

    /* Header rows (date + day) */
    .header-date td, .header-day td {
      background:#D6E4F0; text-align:center; font-weight:700;
      font-size:0.82rem; padding:7px 6px; border:1px solid var(--border);
    }
    .header-day td { background:#C5D9EA; font-size:0.8rem; font-weight:600; }
    .time-col { width:80px !important; }

    /* Time rows */
    .sched-table tbody tr td {
      border:1px solid var(--border); font-size:0.78rem; vertical-align:top;
      padding:0; height:28px; min-width:120px;
    }
    .sched-table tbody tr td.time-cell {
      background:#D6E4F0; font-weight:700; font-size:0.78rem; text-align:right;
      padding:4px 8px 4px 4px; white-space:nowrap; color:#0F1923;
      min-width:80px; width:80px;
    }
    .sched-table tbody tr td.empty-cell { background:#fff; }

    /* Booked cell */
    .booked-cell {
      background:#FFD700; vertical-align:middle; text-align:center;
      padding:4px 6px; cursor:pointer; transition:background 140ms;
    }
    .booked-cell:hover { background:#f0c800; }
    .booked-purpose { font-weight:700; font-size:0.76rem; color:#0F1923; line-height:1.3; }
    .booked-by      { font-size:0.7rem; color:#333; margin-top:1px; }

    /* Current time highlight */
    .current-time-row td.empty-cell { background:#fff8e1; }

    /* ── Empty state ── */
    .empty-state { text-align:center; padding:48px; color:var(--muted); font-size:0.9rem; }

    /* ── Legend ── */
    .legend { display:flex; align-items:center; gap:18px; margin-top:12px; flex-wrap:wrap; font-size:0.78rem; color:var(--muted); }
    .leg-item { display:flex; align-items:center; gap:6px; }
    .leg-box  { width:14px; height:14px; border-radius:3px; border:1px solid #ccc; }

    /* Toast */
    .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--navy); color:#fff; padding:11px 20px; border-radius:9px; font-size:0.875rem; font-weight:500; box-shadow:0 4px 20px rgba(0,0,0,.18); transition:all 320ms; z-index:999; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 18 18" fill="none">
        <rect x="2" y="2" width="6" height="6" rx="1.5" fill="white"/>
        <rect x="10" y="2" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
        <rect x="2" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
        <rect x="10" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".3"/>
      </svg>
      <span class="brand-name">EMS — Room Schedule</span>
    </div>
    <a href="login.html?redirect=room-booking.html" class="book-btn">📅 Book a Room</a>
  </header>

  <div class="page">

    <!-- Controls -->
    <div class="controls">
      <span class="room-label">Room:</span>
      <select class="room-sel" id="roomSel" onchange="renderSchedule()">
        <option value="">Loading rooms…</option>
      </select>
      <button class="nav-btn" id="prevWeek">‹ Prev</button>
      <button class="today-btn" id="thisWeek">This Week</button>
      <button class="nav-btn" id="nextWeek">Next ›</button>
      <span class="live-badge"><span class="live-dot"></span>Live</span>
    </div>

    <!-- Schedule table -->
    <div class="schedule-wrap" id="scheduleWrap">
      <div class="empty-state">Loading schedule…</div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="leg-item"><div class="leg-box" style="background:#FFD700;"></div>Booked</div>
      <div class="leg-item"><div class="leg-box" style="background:#fff;"></div>Available</div>
      <div class="leg-item"><div class="leg-box" style="background:#fff8e1;"></div>Current time slot</div>
    </div>

  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="js/room-schedule.js"></script>
</body>
</html>

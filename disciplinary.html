<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disciplinary — E&amp;C Portal</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .page{max-width:680px;margin:0 auto;padding:28px 20px 64px}
    .page-head{margin-bottom:24px}
    .page-head h1{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
    .page-head p{font-size:0.8rem;color:var(--muted);margin-top:4px}
    .disc-table{width:100%;border-collapse:collapse;font-size:0.875rem}
    .disc-table thead tr{background:#F0F4FA}
    .disc-table th{padding:10px 14px;font-size:0.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--border);text-align:left}
    .disc-table td{padding:7px 14px;border:1px solid var(--border);vertical-align:middle}
    .disc-table tbody tr:hover td{background:#fafbfc}
    .disc-table tfoot td{background:#EEF3FA;border:1px solid var(--border)}
    .sl-cell{text-align:center;color:var(--muted);font-size:0.78rem;width:40px}
    .cat-cell{font-weight:500;color:var(--text)}
    .total-label{text-align:right;font-weight:700;color:var(--navy);padding-right:20px}
    .total-val{text-align:center;font-weight:800;font-size:1.1rem;color:var(--rust);width:160px}
    .disc-input{width:90px;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:0.9rem;text-align:center;background:#fff;outline:none;transition:border-color 160ms,box-shadow 160ms}
    .disc-input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,58,95,.09)}
    .disc-input::-webkit-outer-spin-button,.disc-input::-webkit-inner-spin-button{-webkit-appearance:none}
    .save-bar{display:flex;align-items:center;gap:14px;padding:18px 0;flex-wrap:wrap}
    .btn-save{padding:11px 32px;border-radius:9px;background:var(--navy);color:#fff;border:none;font-family:inherit;font-size:0.875rem;font-weight:700;cursor:pointer;transition:background 160ms}
    .btn-save:hover{background:var(--steel)}
    .btn-save:disabled{opacity:.5;cursor:not-allowed}
    .save-msg{font-size:0.875rem}
    .save-msg.success{color:var(--sage)}
    .save-msg.error{color:var(--rust)}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
          <rect x="2" y="2" width="6" height="6" rx="1.5" fill="white"/>
          <rect x="10" y="2" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
          <rect x="2" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".3"/>
        </svg>
      </div>
      <span class="brand-name">E&amp;C Portal</span>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="topbar-link">← Home</a>
      <a href="dashboard.html" class="topbar-link">← My Portal</a>
      <span class="user-badge" id="topbarEmail"></span>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="page">
    <div class="page-head">
      <h1>⚖️ Outstanding Disciplinary Cases</h1>
      <p>Enter current outstanding count per category. Save anytime to update the live dashboard.</p>
    </div>
    <div class="card">
      <div id="tableArea" style="padding:20px;color:var(--muted);">Loading…</div>
    </div>
    <div class="save-bar">
      <button class="btn-save" id="saveBtn">💾 Save Current Data</button>
      <span class="save-msg" id="saveMsg"></span>
    </div>
  </div>

  <script type="module" src="js/disciplinary.js"></script>
</body>
</html>

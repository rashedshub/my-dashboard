<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disciplinary — E&amp;C Portal</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .page { max-width:1100px; margin:0 auto; padding:28px 20px 64px; }
    .page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
    .page-head h1 { font-size:1.2rem; font-weight:700; letter-spacing:-.02em; }
    .page-head p  { font-size:0.8rem; color:var(--muted); margin-top:3px; }
    .controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
    .ctrl-label { font-size:0.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .ctrl-select {
      padding:8px 14px; border:1.5px solid var(--border); border-radius:8px;
      font-family:inherit; font-size:0.875rem; font-weight:600; color:var(--text);
      background:var(--surface); outline:none; cursor:pointer; transition:border-color 180ms;
    }
    .ctrl-select:focus { border-color:var(--navy); }

    /* Summary table */
    .disc-summary-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    .disc-summary-table thead tr { background:#F0F4FA; }
    .disc-summary-table th {
      padding:9px 8px; font-size:0.68rem; font-weight:700;
      color:var(--muted); text-transform:uppercase; letter-spacing:.06em;
      border:1px solid var(--border); text-align:center;
    }
    .disc-summary-table th:first-child { text-align:left; min-width:200px; }
    .disc-summary-table td { padding:6px 6px; border:1px solid var(--border); text-align:center; }
    .disc-summary-table tbody tr:hover td { background:#fafbfc; }
    .cat-cell { text-align:left !important; font-weight:500; color:var(--text); padding-left:10px !important; }
    .total-cell { font-weight:700; color:var(--navy); background:#F8F9FB; }
    .disc-summary-table tfoot td { background:#EEF3FA; font-weight:700; }
    .disc-input {
      width:52px; padding:4px 6px; border:1px solid var(--border);
      border-radius:5px; font-family:inherit; font-size:0.8rem; text-align:center;
      background:#fff; outline:none; transition:border-color 160ms;
    }
    .disc-input:focus { border-color:var(--navy); }
    .disc-input::-webkit-outer-spin-button,
    .disc-input::-webkit-inner-spin-button { -webkit-appearance:none; }

    /* Save bar */
    .save-bar { display:flex; align-items:center; gap:14px; padding:16px 0; flex-wrap:wrap; }
    .btn-save {
      padding:10px 28px; border-radius:9px; background:var(--navy); color:#fff;
      border:none; font-family:inherit; font-size:0.875rem; font-weight:700;
      cursor:pointer; transition:background 160ms;
    }
    .btn-save:hover { background:var(--steel); }
    .btn-save:disabled { opacity:.5; cursor:not-allowed; }
    .save-msg { font-size:0.875rem; }
    .save-msg.success { color:var(--sage); }
    .save-msg.error   { color:var(--rust); }

    @media(max-width:768px){
      .page{ padding:12px 8px 48px; }
      .disc-input{ width:40px; font-size:0.72rem; }
      .disc-summary-table th, .disc-summary-table td{ padding:5px 4px; font-size:0.7rem; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
          <rect x="2" y="2" width="6" height="6" rx="1.5" fill="white"/>
          <rect x="10" y="2" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
          <rect x="2" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".3"/>
        </svg>
      </div>
      <span class="brand-name">E&amp;C Portal</span>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="topbar-link">← Home</a>
      <a href="dashboard.html" class="topbar-link">← My Portal</a>
      <span class="user-badge" id="topbarEmail"></span>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="page">
    <div class="page-head">
      <div>
        <h1>⚖️ Outstanding Disciplinary</h1>
        <p>Enter monthly outstanding case count per category.</p>
      </div>
    </div>

    <div class="controls">
      <span class="ctrl-label">Year</span>
      <select class="ctrl-select" id="yearSelect"></select>
    </div>

    <div class="card">
      <div id="tableArea" style="padding:20px;color:var(--muted);">Loading…</div>
    </div>

    <div class="save-bar">
      <button class="btn-save" id="saveBtn">Save Data</button>
      <span class="save-msg" id="saveMsg"></span>
    </div>
  </div>

  <script type="module" src="js/disciplinary.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Room Booking — EMS</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    :root {
      --navy:  #1E3A5F; --steel: #2E5B88; --teal: #1B6B6B;
      --sage:  #3A6B4A; --gold:  #8B6914; --rust: #8B3A2A;
      --bg: #F0F2F5; --surface: #fff; --border: #DDE1E7;
      --text: #0F1923; --muted: #64748B; --radius: 12px;
      --ease: cubic-bezier(0.65,0,0.35,1);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }

    /* ── Topbar ── */
    .topbar { position:sticky; top:0; z-index:100; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:56px; }
    .topbar-brand { display:flex; align-items:center; gap:9px; }
    .brand-icon { width:30px; height:30px; background:var(--navy); border-radius:7px; display:flex; align-items:center; justify-content:center; }
    .brand-name { font-size:0.8rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; }
    .topbar-right { display:flex; align-items:center; gap:12px; }
    .user-badge { font-size:0.8rem; color:var(--muted); }
    .logout-btn { background:none; border:1.5px solid var(--border); border-radius:7px; padding:6px 14px; font-family:inherit; font-size:0.8rem; font-weight:500; cursor:pointer; color:var(--text); transition:all 180ms; }
    .logout-btn:hover { border-color:var(--navy); background:var(--navy); color:#fff; }

    /* ── Layout ── */
    .rb-main { max-width:1200px; margin:0 auto; padding:28px 20px 60px; }

    /* ── Page header ── */
    .rb-header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:16px; }
    .rb-header h1 { font-size:1.4rem; font-weight:700; letter-spacing:-0.02em; }
    .rb-header p  { font-size:0.875rem; color:var(--muted); margin-top:3px; }

    /* ── Room filter tabs ── */
    .room-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .room-tab {
      padding:8px 16px; border-radius:99px; border:1.5px solid var(--border);
      background:var(--surface); font-family:inherit; font-size:0.8rem; font-weight:600;
      cursor:pointer; color:var(--muted); transition:all 160ms;
      display:flex; align-items:center; gap:6px;
    }
    .room-tab:hover { border-color:var(--navy); color:var(--navy); }
    .room-tab.active { background:var(--navy); color:#fff; border-color:var(--navy); }
    .room-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

    /* ── Calendar toolbar ── */
    .cal-toolbar {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:16px; flex-wrap:wrap; gap:12px;
    }
    .cal-nav { display:flex; align-items:center; gap:12px; }
    .nav-btn {
      width:36px; height:36px; border-radius:8px; border:1.5px solid var(--border);
      background:var(--surface); font-size:1rem; cursor:pointer; display:flex;
      align-items:center; justify-content:center; transition:all 160ms;
    }
    .nav-btn:hover { border-color:var(--navy); background:var(--navy); color:#fff; }
    .cal-month { font-size:1.05rem; font-weight:700; letter-spacing:-0.01em; min-width:160px; text-align:center; }
    .today-btn {
      padding:7px 16px; border-radius:8px; border:1.5px solid var(--border);
      background:var(--surface); font-family:inherit; font-size:0.8rem; font-weight:600;
      cursor:pointer; color:var(--text); transition:all 160ms;
    }
    .today-btn:hover { border-color:var(--navy); }

    /* ── Calendar grid ── */
    .cal-wrap {
      background:var(--surface); border-radius:var(--radius);
      border:1px solid var(--border); overflow:hidden;
    }
    .cal-head {
      display:grid; grid-template-columns:repeat(7,1fr);
      border-bottom:1.5px solid var(--border); background:#f8f9fb;
    }
    .cal-dow {
      padding:10px; text-align:center; font-size:0.72rem;
      font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em;
    }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
    .cal-cell {
      min-height:110px; border-right:1px solid var(--border);
      border-bottom:1px solid var(--border); padding:8px 6px;
      cursor:pointer; transition:background 140ms; position:relative;
      overflow:hidden;
    }
    .cal-cell:nth-child(7n) { border-right:none; }
    .cal-cell.other-month { background:#fafbfc; }
    .cal-cell.other-month .day-num { color:#ccc; }
    .cal-cell:hover:not(.other-month) { background:#f0f4f8; }
    .cal-cell.today { background:#EEF3FA; }
    .day-num {
      font-size:0.85rem; font-weight:600; color:var(--muted);
      margin-bottom:6px; display:block;
    }
    .cal-cell.today .day-num {
      background:var(--navy); color:#fff; width:26px; height:26px;
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:0.8rem; margin-bottom:6px;
    }

    /* ── Event chips ── */
    .event-chip {
      display:flex; align-items:center; gap:4px;
      padding:3px 7px; border-radius:5px; margin-bottom:3px;
      font-size:0.7rem; font-weight:600; cursor:pointer;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width:100%; transition:opacity 160ms;
    }
    .event-chip:hover { opacity:0.85; }
    .event-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .more-chip { font-size:0.68rem; color:var(--muted); padding:2px 4px; cursor:pointer; }
    .more-chip:hover { color:var(--navy); }

    /* ── Book button ── */
    .book-fab {
      position:fixed; bottom:32px; right:32px;
      background:var(--navy); color:#fff; border:none;
      width:56px; height:56px; border-radius:50%;
      font-size:1.5rem; cursor:pointer; box-shadow:0 4px 20px rgba(30,58,95,.35);
      display:flex; align-items:center; justify-content:center;
      transition:transform 160ms, box-shadow 160ms;
      font-family:inherit; z-index:50;
    }
    .book-fab:hover { transform:scale(1.08); box-shadow:0 6px 28px rgba(30,58,95,.45); }

    /* ── Modal ── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(15,25,35,0.45);
      backdrop-filter:blur(4px); z-index:200;
      display:flex; align-items:center; justify-content:center;
      padding:20px; opacity:0; pointer-events:none;
      transition:opacity 250ms var(--ease);
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:var(--surface); border-radius:16px; width:100%; max-width:520px;
      box-shadow:0 20px 60px rgba(0,0,0,.18);
      transform:translateY(20px) scale(0.97);
      transition:transform 280ms var(--ease);
      overflow:hidden;
    }
    .modal-overlay.open .modal { transform:translateY(0) scale(1); }
    .modal-header {
      padding:22px 24px 18px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .modal-header h2 { font-size:1.05rem; font-weight:700; }
    .modal-close {
      background:none; border:none; font-size:1.1rem; cursor:pointer;
      color:var(--muted); padding:4px 8px; border-radius:6px; transition:all 160ms;
    }
    .modal-close:hover { background:#f0f0ee; color:var(--text); }
    .modal-body { padding:20px 24px; }
    .modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; }

    /* Form fields */
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:0.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; }
    .field input, .field select, .field textarea {
      width:100%; padding:10px 13px; border:1.5px solid var(--border);
      border-radius:8px; font-family:inherit; font-size:0.9rem;
      color:var(--text); background:#fafaf9; outline:none;
      transition:border-color 200ms, box-shadow 200ms, background 200ms;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color:var(--navy); background:#fff;
      box-shadow:0 0 0 3px rgba(30,58,95,.1);
    }
    .field textarea { resize:vertical; min-height:70px; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* Room color swatches in select */
    .room-option-label { display:flex; align-items:center; gap:8px; }

    /* ── Booking detail modal ── */
    .detail-row { display:flex; gap:12px; margin-bottom:12px; align-items:flex-start; }
    .detail-icon { font-size:1.1rem; flex-shrink:0; margin-top:1px; }
    .detail-info .di-label { font-size:0.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }
    .detail-info .di-val   { font-size:0.9rem; font-weight:500; }
    .booked-by-me { background:#EEF3FA; border-radius:8px; padding:10px 14px; font-size:0.82rem; color:var(--navy); font-weight:600; margin-bottom:14px; }
    .booked-by-other { background:#fef9c3; border-radius:8px; padding:10px 14px; font-size:0.82rem; color:#854d0e; font-weight:600; margin-bottom:14px; }

    /* ── Conflict banner ── */
    .conflict-banner { background:#fee2e2; border-radius:8px; padding:10px 14px; font-size:0.82rem; color:#991b1b; font-weight:600; margin-bottom:14px; display:none; }
    .conflict-banner.show { display:block; }

    /* ── Buttons ── */
    .btn-primary {
      padding:10px 22px; border-radius:8px; background:var(--navy); color:#fff;
      border:none; font-family:inherit; font-size:0.875rem; font-weight:600;
      cursor:pointer; transition:background 180ms; display:flex; align-items:center; gap:8px;
    }
    .btn-primary:hover { background:#2E5B88; }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-ghost {
      padding:10px 18px; border-radius:8px; background:none; color:var(--muted);
      border:1.5px solid var(--border); font-family:inherit; font-size:0.875rem;
      font-weight:500; cursor:pointer; transition:all 180ms;
    }
    .btn-ghost:hover { border-color:var(--text); color:var(--text); }
    .btn-danger {
      padding:10px 18px; border-radius:8px; background:#fee2e2; color:#991b1b;
      border:1.5px solid #fecaca; font-family:inherit; font-size:0.875rem;
      font-weight:600; cursor:pointer; transition:all 180ms;
    }
    .btn-danger:hover { background:#991b1b; color:#fff; border-color:#991b1b; }

    /* spinner */
    .spin { width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
    .btn-primary.loading .spin { display:block; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── Legend ── */
    .legend { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--muted); }
    .legend-dot  { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

    /* ── Notification toast ── */
    .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--navy); color:#fff; padding:12px 22px; border-radius:10px; font-size:0.875rem; font-weight:500; box-shadow:0 4px 20px rgba(0,0,0,.18); transition:all 320ms var(--ease); z-index:999; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .toast.error { background:var(--rust); }
    .toast.success { background:var(--sage); }
    .toast.warn  { background:var(--gold); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
          <rect x="2" y="2" width="6" height="6" rx="1.5" fill="white"/>
          <rect x="10" y="2" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
          <rect x="2" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".6"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".3"/>
        </svg>
      </div>
      <span class="brand-name">EMS</span>
    </div>
    <div class="topbar-right">
      <a href="dashboard.html" style="font-size:0.8rem;color:var(--muted);text-decoration:none;margin-right:8px;">← Dashboard</a>
      <span class="user-badge" id="topbarEmail"></span>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="rb-main">

    <div class="rb-header">
      <div>
        <h1>Training Room Booking</h1>
        <p>Click any date to book a room. Conflicts are blocked automatically.</p>
      </div>
      <div class="legend" id="roomLegend"></div>
    </div>

    <!-- Room filter tabs -->
    <div class="room-tabs" id="roomTabs"></div>

    <!-- Calendar toolbar -->
    <div class="cal-toolbar">
      <div class="cal-nav">
        <button class="nav-btn" id="prevBtn">‹</button>
        <div class="cal-month" id="calMonth"></div>
        <button class="nav-btn" id="nextBtn">›</button>
      </div>
      <button class="today-btn" id="todayBtn">Today</button>
    </div>

    <!-- Calendar -->
    <div class="cal-wrap">
      <div class="cal-head" id="calHead"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

  </main>

  <!-- FAB book button -->
  <button class="book-fab" id="bookFab" title="Book a room">＋</button>

  <!-- ── Book Modal ── -->
  <div class="modal-overlay" id="bookModal">
    <div class="modal">
      <div class="modal-header">
        <h2>📅 Book a Room</h2>
        <button class="modal-close" id="bookModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="conflict-banner" id="conflictBanner">⚠️ This time slot conflicts with an existing booking.</div>
        <div class="field">
          <label>Room</label>
          <select id="bookRoom"></select>
        </div>
        <div class="field">
          <label>Title / Purpose</label>
          <input type="text" id="bookTitle" placeholder="e.g. New Employee Orientation"/>
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="bookDate"/>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Start Time</label>
            <input type="time" id="bookStart" value="09:00"/>
          </div>
          <div class="field">
            <label>End Time</label>
            <input type="time" id="bookEnd" value="10:00"/>
          </div>
        </div>
        <div class="field">
          <label>Notes (optional)</label>
          <textarea id="bookNotes" placeholder="Additional details…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="bookCancel">Cancel</button>
        <button class="btn-primary" id="bookSubmit">
          <span>Confirm Booking</span>
          <span class="spin"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Detail Modal ── -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="detailTitle">Booking Details</h2>
        <button class="modal-close" id="detailModalClose">✕</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer" id="detailFooter"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="js/room-booking.js"></script>
</body>
</html>

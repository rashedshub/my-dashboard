<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Training Notice — E&amp;C Portal</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Calibri',Arial,sans-serif;background:#f0f2f5;color:#000;padding:20px}

    /* ── Toolbar ── */
    .toolbar{max-width:980px;margin:0 auto 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;padding:12px 16px;border-radius:10px;border:1px solid #ddd}
    .toolbar label{font-size:13px;font-weight:700;color:#444}
    .toolbar select{padding:7px 12px;border-radius:7px;border:1px solid #ccc;font-family:inherit;font-size:13px;background:#fff;cursor:pointer}
    .nav-grp{display:flex;align-items:center;gap:6px}
    .nav-btn{padding:6px 14px;border-radius:7px;border:1px solid #ccc;background:#fff;font-family:inherit;font-size:13px;cursor:pointer;transition:all 150ms}
    .nav-btn:hover{background:#1E3A5F;color:#fff;border-color:#1E3A5F}
    .nav-lbl{font-size:13px;font-weight:700;min-width:140px;text-align:center;color:#333}
    .btn-print{padding:9px 22px;border-radius:7px;border:none;background:#1E3A5F;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-left:auto}
    .btn-print:hover{background:#2E5B88}
    .btn-back{padding:9px 16px;border-radius:7px;border:1px solid #ccc;background:#fff;font-family:inherit;font-size:13px;cursor:pointer;text-decoration:none;color:#000;display:inline-block}

    /* ── Document ── */
    .doc{max-width:980px;margin:0 auto;background:#fff;border:1px solid #bbb}

    /* Repeating header — inside table for print repeat */
    .doc-company{background:#1E3A5F;color:#fff;text-align:center;padding:9px 16px;font-size:15px;font-weight:700}
    .doc-title{text-align:center;font-size:13px;font-weight:700;padding:6px 16px;border-bottom:1px solid #ccc}
    .doc-intro{text-align:center;font-size:12px;padding:5px 16px;background:#eef0f3;border-bottom:1px solid #ccc}

    /* Main data table */
    .data-wrap{width:100%}
    .data-wrap table{width:100%;border-collapse:collapse;font-size:11.5px}
    .data-wrap thead{display:table-header-group} /* repeats on every printed page */
    .data-wrap tfoot{display:table-footer-group} /* repeats on every printed page */
    .data-wrap table th{border:1px solid #888;padding:6px 8px;text-align:left;background:#fff;font-weight:700;font-size:11px}
    .data-wrap table td{border:1px solid #888;padding:5px 8px;vertical-align:middle}
    .sl-cell{text-align:center;font-weight:600;width:32px;font-size:12px;color:#333}

    /* Repeating doc header inside thead */
    .thead-doc-company{
      background:#1E3A5F !important;
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color:#fff !important;
      text-align:center;font-size:14px;font-weight:700;padding:8px
    }
    .thead-doc-title{text-align:center;font-size:12px;font-weight:700;padding:5px;border-bottom:1px solid #ccc}
    .thead-doc-intro{text-align:center;font-size:11px;padding:4px;background:#eef0f3;border-bottom:1px solid #ccc}

    /* Signature footer */
    .sig-footer{width:100%;padding:16px 0 8px;border-top:1px solid #ccc;margin-top:4px}
    .sig-row{display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;gap:20px}
    .sig-block{flex:1;text-align:center}
    .sig-line{border-top:1px solid #000;margin:40px auto 4px;width:80%}
    .sig-name{font-size:11px;font-weight:700}
    .sig-title{font-size:10px;color:#444}
    .page-note{text-align:center;font-size:10px;color:#666;padding:4px 0 6px}

    /* Screen-only footer (generated info) */
    .doc-footer{text-align:right;font-size:10px;color:#666;padding:5px 14px;border-top:1px solid #eee}

    .no-data{text-align:center;padding:32px;color:#888;font-size:13px}
    .status{text-align:center;padding:20px;color:#666;font-size:13px}

    /* ── Print styles ── */
    @media print {
      body{background:#fff;padding:0;margin:0}
      .toolbar{display:none}
      .doc{border:none;max-width:100%;margin:0}
      .doc-footer{display:none}

      * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
      /* Page setup */
      @page{
        size:A4 landscape;
        margin:8mm 8mm 18mm 8mm; /* extra bottom for footer */
        @bottom-center{
          content: "Page " counter(page) " of " counter(pages);
          font-size:9pt;
          font-family:'Calibri',Arial,sans-serif;
        }
      }

      /* thead repeats automatically on every page */
      .data-wrap thead{display:table-header-group}
      .data-wrap tfoot{display:table-footer-group}

      /* Avoid breaking rows across pages */
      .data-wrap tbody tr{page-break-inside:avoid}

      /* Page number via CSS counter */
      .page-note::after{
        content: "Page " counter(page);
      }
    }
  </style>
</head>
<body>

<!-- Toolbar (hidden on print) -->
<div class="toolbar">
  <a href="training-calendar.html" class="btn-back">← Back</a>
  <label>Range:</label>
  <select id="rangeSelect">
    <option value="weekly">Weekly (Sat – Thu)</option>
    <option value="monthly">Monthly</option>
  </select>
  <div class="nav-grp">
    <button class="nav-btn" id="prevBtn">◀ Prev</button>
    <span class="nav-lbl" id="navLbl">This Week</span>
    <button class="nav-btn" id="nextBtn">Next ▶</button>
  </div>
  <label>Venue:</label>
  <select id="venueSelect">
    <option value="all">All Venues</option>
  </select>
  <button class="btn-print" onclick="window.print()">🖨️ Print / Save as PDF</button>
  <span style="font-size:11px;color:#888;margin-left:4px;">⚠️ Enable "Background graphics" in print settings to show colored header</span>
</div>

<!-- Document -->
<div class="doc">
  <div id="docBody"><div class="status">Loading data…</div></div>
  <div class="doc-footer" id="docFooter"></div>
</div>

<script type="module">
import { app } from "./js/firebase.js";
import { getFirestore, collection, getDocs, onSnapshot }
  from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const db = getFirestore(app);

let rooms    = [];
let bookings = [];
let offset   = 0;

const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

function dk(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtT(t){ const[h,m]=t.split(":").map(Number),s=h>=12?"PM":"AM",hh=h%12||12; return `${hh}:${String(m).padStart(2,"0")}${s}`; }

function render(){
  const range = document.getElementById("rangeSelect").value;
  const venue = document.getElementById("venueSelect").value;
  const vName = venue==="all" ? "All Venues" : (rooms.find(r=>r.id===venue)?.name||"All Venues");

  let bks, title;

  if(range === "weekly"){
    const today = new Date();
    const diff  = (today.getDay()+1)%7;
    const sat   = new Date(today);
    sat.setDate(today.getDate() - diff + offset*7);
    sat.setHours(0,0,0,0);
    const dates = Array.from({length:6},(_,i)=>{ const d=new Date(sat); d.setDate(sat.getDate()+i); return d; });
    const keys  = dates.map(dk);
    bks = bookings
      .filter(b=>(venue==="all"||b.roomId===venue) && keys.includes(b.date))
      .sort((a,b)=>a.date.localeCompare(b.date)||a.startTime.localeCompare(b.startTime));
    const satFmt = sat.toLocaleDateString("en-US",{day:"numeric",month:"long",year:"numeric"});
    const thuFmt = dates[5].toLocaleDateString("en-US",{day:"numeric",month:"long",year:"numeric"});
    title = `Training Notice of ${satFmt} to ${thuFmt}`;
    document.getElementById("navLbl").textContent =
      offset===0?"This Week":offset<0?`${Math.abs(offset)}w ago`:`${offset}w ahead`;
  } else {
    const base = new Date(new Date().getFullYear(), new Date().getMonth()+offset, 1);
    const y=base.getFullYear(), mo=base.getMonth();
    bks = bookings.filter(b=>{
      if(venue!=="all"&&b.roomId!==venue) return false;
      const[by,bmo]=b.date.split("-").map(Number);
      return by===y&&(bmo-1)===mo;
    }).sort((a,b)=>a.date.localeCompare(b.date)||a.startTime.localeCompare(b.startTime));
    title = `Training Notice — ${MONTHS[mo]} ${base.getFullYear()}`;
    document.getElementById("navLbl").textContent = `${MONTHS[mo]} ${base.getFullYear()}`;
  }

  document.getElementById("docFooter").textContent =
    `Venue: ${vName}   |   Generated: ${new Date().toLocaleString()}`;

  if(!bks.length){
    document.getElementById("docBody").innerHTML =
      `<div class="no-data">No bookings found for this period.</div>`;
    return;
  }

  // Group by date
  const byDate = {};
  bks.forEach(b=>{ if(!byDate[b.date]) byDate[b.date]=[]; byDate[b.date].push(b); });

  let rows = "";
  let sl = 1;
  Object.keys(byDate).sort().forEach(dKey=>{
    const dayBks = byDate[dKey];
    const d = new Date(dKey+"T00:00:00");
    dayBks.forEach(b=>{
      const room    = rooms.find(r=>r.id===b.roomId);
      const dateFmt = d.toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      rows += `<tr>
        <td class="sl-cell">${sl++}</td>
        <td>${b.title||"—"}</td>
        <td>${b.resourcePerson||"—"}</td>
        <td>${dateFmt}<br><strong>${fmtT(b.startTime)}-${fmtT(b.endTime)}</strong></td>
        <td>${b.targetGroup||"—"}</td>
        <td>${room?.name||"—"}</td>
        <td>${b.bookedByName||"—"}</td>
      </tr>`;
    });
  });

  // Signature footer (repeats on every page via tfoot)
  const sigFooter = `
    <tr>
      <td colspan="7" style="padding:0;border:none;">
        <div class="sig-footer">
          <div class="sig-row">
            <div class="sig-block">
              <div class="sig-line"></div>
              <div class="sig-name">Approval of HOD — E&amp;C</div>
              <div class="sig-title">Head of Department, Employee &amp; Culture</div>
            </div>
            <div class="sig-block">
              <div class="sig-line"></div>
              <div class="sig-name">L&amp;D Team</div>
              <div class="sig-title">Learning &amp; Development Team</div>
            </div>
          </div>
          <div class="page-note"></div>
        </div>
      </td>
    </tr>`;

  document.getElementById("docBody").innerHTML = `
    <div class="data-wrap">
      <table>
        <thead>
          <tr><th colspan="7" class="thead-doc-company" style="background:#1E3A5F !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#fff !important;border:1.5px solid #1E3A5F;">Youngone Hi-Tech Sportswear Industries Ltd.</th></tr>
          <tr><th colspan="7" class="thead-doc-title">${title}</th></tr>
          <tr><th colspan="7" class="thead-doc-intro">This is to inform all concerned that management will going to arrange below training session:</th></tr>
          <tr style="background:#D6E4F0;">
            <th style="width:32px;background:#D6E4F0;">SL</th>
            <th style="background:#D6E4F0;">Training Topics</th>
            <th style="width:140px;background:#D6E4F0;">Trainer / Resource Person</th>
            <th style="width:155px;background:#D6E4F0;">Date &amp; Time</th>
            <th style="width:100px;background:#D6E4F0;">Target Group</th>
            <th style="width:90px;background:#D6E4F0;">Venue</th>
            <th style="width:110px;background:#D6E4F0;">Coordinated by</th>
          </tr>
        </thead>
        <tfoot>${sigFooter}</tfoot>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// Load data
const rSnap = await getDocs(collection(db,"training_rooms"));
rooms = rSnap.docs.map(d=>({id:d.id,...d.data()}))
  .sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
const vSel = document.getElementById("venueSelect");
rooms.forEach(r=>{ const o=document.createElement("option"); o.value=r.id; o.textContent=r.name; vSel.appendChild(o); });

const bSnap = await getDocs(collection(db,"room_bookings"));
bookings = bSnap.docs.map(d=>({id:d.id,...d.data()}));
render();

onSnapshot(collection(db,"room_bookings"), snap=>{
  bookings = snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
});

document.getElementById("rangeSelect").addEventListener("change",()=>{ offset=0; render(); });
document.getElementById("venueSelect").addEventListener("change", render);
document.getElementById("prevBtn").addEventListener("click",()=>{ offset--; render(); });
document.getElementById("nextBtn").addEventListener("click",()=>{ offset++; render(); });
</script>
</body>
</html>
